<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E0E14" />
    <meta
      name="description"
      content="Manga ve manhwa bölüm görsellerine logo basan, tarayıcı tabanlı watermark aracı. Tekli ve çoklu klasör desteği."
    />
    <title>Watermarker — Manga/Manhwa Logo Basıcı</title>
    <style>
      html,body,#root{margin:0;min-height:100%;background:#0E0E14;color:#f2f2f5}
      html[data-theme='light'],html[data-theme='light'] body,html[data-theme='light'] #root{background:#f3f3f6;color:#16161d}
    </style>
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('watermarker.ui.v1') || '{}');
        var theme = p.theme === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-compact', p.compact ? '1' : '0');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f3f3f6' : '#0E0E14');
      } catch (e) {}
    </script>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
